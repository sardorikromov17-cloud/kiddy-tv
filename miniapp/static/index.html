<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Kiddy TV</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#1F2A6B;--muted:#4A5580;--red:#E0312B;--red-d:#B3201B;--red-l:#FFE1DE;--red-s:#F4B9B3;--blue:#2F55B4;--blue-d:#2446A0;--blue-l:#E1EAFF;--blue-s:#B9CBF2;--green:#3DAA3A;--green-d:#23721F;--green-l:#DDF3DA;--green-s:#B5DFAF;--orange:#F28C1E;--orange-d:#A65400;--orange-l:#FFE9CC;--orange-s:#F3CC95;--cream:#FFF4E6;--soft:#F4F6FB}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#fff;color:var(--navy);font-family:Nunito,system-ui,sans-serif;font-weight:600;font-size:16px;overscroll-behavior:none}
h1,h2,h3{font-family:Fredoka,Nunito,sans-serif;font-weight:600;margin:0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input{font:inherit;color:var(--navy);border:2px solid #E3E7F1;border-radius:16px;padding:12px 14px;width:100%;min-height:50px;background:#fff}
input:focus{outline:none;border-color:var(--blue)}
.app{max-width:520px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:28px}
.hero{background:var(--cream);border-radius:0 0 34px 34px;padding:16px 18px 22px;position:relative;overflow:hidden}
.top{display:flex;align-items:center;gap:10px;position:relative;z-index:1}
.brand{font-family:Fredoka,sans-serif;font-weight:600;font-size:24px;display:flex;align-items:center;gap:1px}
.tv{margin-left:6px;background:var(--blue);color:#fff;border-radius:9px;padding:0 8px;font-size:17px}
.chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border-radius:999px;height:44px;padding:0 14px;font-weight:700;box-shadow:0 3px 0 #EBDCC6}
.round{width:44px;height:44px;border-radius:50%;background:#fff;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 3px 0 #EBDCC6}
.sp{flex:1}
.pad{padding:18px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{border-radius:26px;padding:16px;height:118px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;width:100%}
.tile span{font-family:Fredoka,sans-serif;font-weight:600;font-size:21px}
.mini{border-radius:22px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;font-size:14px;width:100%}
.t-red{background:var(--red-l);color:var(--red-d);box-shadow:0 6px 0 var(--red-s)}
.t-blue{background:var(--blue-l);color:var(--blue-d);box-shadow:0 6px 0 var(--blue-s)}
.t-green{background:var(--green-l);color:var(--green-d);box-shadow:0 6px 0 var(--green-s)}
.t-orange{background:var(--orange-l);color:var(--orange-d);box-shadow:0 6px 0 var(--orange-s)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 22px;border-radius:18px;background:var(--blue);color:#fff;font-weight:700;font-size:17px;width:100%}
.btn.red{background:#C8231D}.btn.green{background:var(--green-d)}.btn.ghost{background:var(--soft);color:var(--navy)}
.btn:disabled{opacity:.5}
.bar{height:10px;background:#fff;border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:999px}
.card{display:flex;flex-direction:column;gap:8px;text-align:left;width:100%}
.thumb{position:relative;aspect-ratio:16/10;border-radius:20px;overflow:hidden;display:flex;align-items:center;justify-content:center;background-size:cover;background-position:center}
.play{width:46px;height:46px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.dur{position:absolute;right:8px;bottom:8px;background:rgba(31,42,107,.85);color:#fff;font-size:12px;padding:2px 8px;border-radius:999px}
.ttl{font-weight:700;font-size:15px;line-height:1.25}
.head{display:flex;align-items:center;gap:12px;padding:14px 18px}
.head h1{font-size:24px}
.muted{color:var(--muted)}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%) translateY(-120px);background:var(--navy);color:#fff;padding:12px 18px;border-radius:16px;font-weight:700;z-index:50;transition:transform .3s;max-width:90vw;text-align:center}
.toast.on{transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;background:rgba(31,42,107,.45);display:flex;align-items:flex-end;justify-content:center;z-index:40}
.sheet{background:#fff;border-radius:28px 28px 0 0;padding:24px 20px 30px;width:100%;max-width:520px;display:flex;flex-direction:column;gap:14px;text-align:center}
.keys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.key{height:64px;border-radius:20px;background:var(--soft);font-family:Fredoka,sans-serif;font-size:28px;font-weight:600}
.dots{display:flex;gap:14px;justify-content:center}
.dots i{width:18px;height:18px;border-radius:50%;border:3px solid var(--blue)}
.dots i.on{background:var(--blue)}
.row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid #EEF1F7}
.row:last-child{border-bottom:0}
.sw{width:56px;height:34px;border-radius:999px;background:#D3D9E8;padding:3px;display:flex;flex:none}
.sw.on{background:var(--green);justify-content:flex-end}
.sw b{width:28px;height:28px;border-radius:50%;background:#fff;display:block}
.box{background:#fff;border-radius:24px;padding:4px 16px}
.pal{display:flex;justify-content:space-between;gap:6px}
.pal button{width:46px;height:46px;border-radius:50%;border:4px solid #fff;box-shadow:0 3px 0 rgba(31,42,107,.2)}
.pal button.on{border-color:var(--navy)}
.swatch{height:96px;border-radius:24px;box-shadow:0 5px 0 rgba(31,42,107,.15)}
.big{font-family:Fredoka,sans-serif;font-weight:600}
.vid{width:100%;aspect-ratio:16/9;border:0;border-radius:22px;background:#000;display:block}
.memory{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.memory button{aspect-ratio:1;border-radius:18px;background:var(--blue-l);box-shadow:0 4px 0 var(--blue-s);display:flex;align-items:center;justify-content:center}
.memory button.open{background:#fff;box-shadow:0 0 0 3px var(--blue-l) inset}
.memory button.done{background:var(--green-l);box-shadow:none}
</style>
</head>
<body>
<div class="app" id="app"><div class="empty">Yuklanmoqda...</div></div>
<div class="toast" id="toast" role="status"></div>
<script>
const tg = window.Telegram ? Telegram.WebApp : null;
const INIT = tg ? tg.initData : "";
let ME = null, PKEY = "", VIEW = ["home"];
const SER = []; // serial nomlari (apostrofli nomlar onclick'ni buzmasligi uchun indeks orqali)
function openSeries(i){ haptic(); go("series", SER[i][0], SER[i][1]); }
const $app = document.getElementById("app");
const KIND = {
  cartoon:{t:"Multfilmlar",c:"red",i:"M12 3a9 9 0 100 18 9 9 0 000-18zM9 10h.01M15 10h.01M8.5 14.5c1.8 2 5.2 2 7 0"},
  film:{t:"Kinolar",c:"blue",i:"M3 8h18v12H3zM3 8l3-4h3L6 8M11 8l3-4h3l-3 4"},
  video:{t:"Videolar",c:"green",i:"M5 5h14a2 2 0 012 2v10a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2zM10 9v6l5-3z"},
  game:{t:"O'yinlar",c:"orange",i:"M7 7h10a5 5 0 010 10H7A5 5 0 017 7zM7 10.5v3M5.5 12h3M16 11h.01M18 13h.01"},
  audio:{t:"Ertaklar",c:"blue",i:"M4 6c3-1.5 5.5-1.5 8 0v13c-2.5-1.5-5-1.5-8 0zM20 6c-3-1.5-5.5-1.5-8 0v13c2.5-1.5 5-1.5 8 0z"},
  islamic:{t:"Islomiy",c:"green",i:"M12 3a9 9 0 108.5 12A7 7 0 1112 3zM18 4l.8 1.8 1.9.2-1.4 1.3.4 1.9-1.7-1-1.7 1 .4-1.9-1.4-1.3 1.9-.2z"},
  music:{t:"Qo'shiqlar",c:"green",i:"M9 18V5l12-2v13M9 18a3 3 0 11-6 0 3 3 0 016 0zM21 16a3 3 0 11-6 0 3 3 0 016 0z"}
};
const INK = {red:"#B3201B",blue:"#2446A0",green:"#23721F",orange:"#A65400"};
const BG = {red:"#FFE1DE",blue:"#E1EAFF",green:"#DDF3DA",orange:"#FFE9CC"};
const ico = (d, c="currentColor", s=28, w=2.2) => `<svg aria-hidden="true" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>`;
const STAR = (s=20) => `<svg aria-hidden="true" width="${s}" height="${s}" viewBox="0 0 24 24"><path d="M12 2l3 6.5 7 .8-5.2 4.8 1.5 7L12 17.6 5.7 21l1.5-7L2 9.3l7-.8z" fill="#F28C1E"/></svg>`;
const BACK = ico("M15 5l-7 7 7 7", "#1F2A6B", 22, 2.6);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function haptic(t="light"){ try{ tg.HapticFeedback.impactOccurred(t) }catch(e){} }
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("on"),2600); }
async function api(path, data, method){
  const opt = {method: method || (data ? "POST" : "GET"), headers: {"X-Init-Data": INIT, "X-Parent-Key": PKEY}};
  if (data){ opt.headers["Content-Type"]="application/json"; opt.body=JSON.stringify(data); }
  const r = await fetch(path, opt);
  let j = {}; try{ j = await r.json() }catch(e){}
  if (!r.ok || j.ok === false) throw Object.assign(new Error(j.error || "Xatolik"), {code:r.status});
  return j;
}
function go(...v){ VIEW.push(v); render(); window.scrollTo(0,0); }
function back(){ if (VIEW.length>1){ VIEW.pop(); render(); window.scrollTo(0,0);} }
function head(title){ return `<div class="head"><button class="round" onclick="back()" aria-label="Orqaga">${BACK}</button><h1>${title}</h1></div>`; }
async function refresh(){ ME = await api("/api/me"); }

function render(){
  const v = VIEW[VIEW.length-1]; const name = Array.isArray(v) ? v[0] : v;
  if (tg){ if (VIEW.length>1){ tg.BackButton.show(); } else { tg.BackButton.hide(); } }
  if (!ME) return;
  if (!ME.active && name!=="addchild"){ VIEW=[["addchild",true]]; }
  const cur = VIEW[VIEW.length-1];
  const fn = {home:vHome, list:vList, series:vSeries, letters:vLetters, shapes:vShapes, bigsmall:vBigSmall, oddone:vOddOne, simon:vSimon, math:vMath, pairs8:()=>vPairs(8), player:vPlayer, addchild:vAddChild, kids:vKids, rewards:vRewards, colors:vColors, pairs:vPairs, count:vCount, coloring:vColoring, parent:vParent}[Array.isArray(cur)?cur[0]:cur];
  fn(...(Array.isArray(cur)?cur.slice(1):[]));
}

// ---------- bosh sahifa ----------
function vHome(){
  const c = ME.active, left = Math.max(0, ME.limit - ME.used), pct = Math.min(100, Math.round(ME.used / Math.max(1,ME.limit) * 100));
  const tiles = ["cartoon","film","video","game"].map(k=>{const K=KIND[k];return `<button class="tile t-${K.c}" onclick="go('list','${k}')">${ico(K.i, INK[K.c], 32)}<span>${K.t}</span></button>`}).join("");
  $app.innerHTML = `
  <div class="hero">
    <svg aria-hidden="true" width="120" height="70" viewBox="0 0 120 70" style="position:absolute;right:6px;bottom:4px;pointer-events:none"><path d="M96 14c6 8 8 12 8 15a8 8 0 01-16 0c0-3 2-7 8-15z" fill="#3DAA3A" transform="rotate(30 96 22)"/><circle cx="112" cy="56" r="5" fill="#2F55B4"/><circle cx="70" cy="60" r="4" fill="#F28C1E"/></svg>
    <div class="top">
      <img src="/logo.png" alt="Kiddy" width="44" height="44" style="border-radius:50%">
      <span class="brand"><span style="color:#E0312B">K</span><span style="color:#3DAA3A">i</span><span style="color:#F28C1E">d</span><span style="color:#2F55B4">d</span><span style="color:#E0312B">y</span><span class="tv">TV</span></span>
      <span class="sp"></span>
      <button class="chip" onclick="go('rewards')" aria-label="Yulduzlar">${STAR()} ${c.stars}</button>
      <button class="round" onclick="go('parent')" aria-label="Ota-ona bo'limi">${ico("M12 3l8 3v6c0 4.5-3.5 8-8 9-4.5-1-8-4.5-8-9V6zM9 12l2 2 4-4","#1F2A6B",22)}</button>
    </div>
    <div style="position:relative;margin-top:16px;display:flex;flex-direction:column;gap:8px">
      <button onclick="go('kids')" style="text-align:left"><h1 style="font-size:30px">Salom, ${esc(c.name)}!</h1></button>
      ${ME.blocked_reason ? `<div class="muted" style="font-weight:700">${esc(ME.blocked_reason)}</div>` :
      `<div class="muted" style="font-weight:700">Bugun yana <b style="color:#B3201B">${left} daqiqa</b> ko'rishing mumkin</div>
       <div class="bar"><i style="width:${pct}%"></i></div>`}
    </div>
  </div>
  <div class="pad" style="display:flex;flex-direction:column;gap:22px">
    <div class="grid2">${tiles}</div>
    <button class="tile t-green" style="height:auto;flex-direction:row;align-items:center;gap:14px" onclick="go('list','islamic')">${ico(KIND.islamic.i, INK.green, 34)}<span style="display:flex;flex-direction:column;gap:2px"><span>Islomiy multfilmlar</span><small style="font-family:Nunito;font-size:13px;font-weight:600">Payg'ambarlar va Qur'on qissalari</small></span></button>
    <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px">
      <button class="mini t-blue" onclick="go('list','audio')">${ico(KIND.audio.i,INK.blue,28)}Ertaklar</button>
      <button class="mini t-green" onclick="go('list','music')">${ico(KIND.music.i,INK.green,28)}Qo'shiqlar</button>
      <button class="mini t-red" onclick="go('coloring')">${ico("M12 3a9 9 0 100 18c1.2 0 1.8-.8 1.8-1.6 0-1.2-1-1.4-1-2.4s.8-1.6 1.8-1.6H17a4 4 0 004-4c0-4.6-4-8.4-9-8.4z",INK.red,28)}Bo'yash</button>
      <button class="mini t-orange" onclick="go('rewards')">${STAR(28)}Sovg'alar</button>
    </div>
    ${ME.children.length>1 || true ? `<button class="btn ghost" onclick="go('kids')">${ico("M9 11a4 4 0 100-8 4 4 0 000 8zM2 21v-1a6 6 0 0112 0v1M17 11a3 3 0 100-6M22 21v-1a5 5 0 00-4-4.9","#1F2A6B",22)} Kim tomosha qiladi?</button>`:""}
  </div>`;
}

// ---------- ro'yxat ----------
const GAMES = [
  {id:"colors", t:"Rangni top", c:"red", a:"2+"},
  {id:"shapes", t:"Shakllar", c:"blue", a:"2+"},
  {id:"pairs", t:"Juftini top", c:"green", a:"3+"},
  {id:"count", t:"Sanaymiz", c:"orange", a:"3+"},
  {id:"bigsmall", t:"Katta-kichik", c:"blue", a:"2+"},
  {id:"oddone", t:"Farqli", c:"red", a:"3+"},
  {id:"letters", t:"Harflar", c:"green", a:"4+"},
  {id:"simon", t:"Eslab qol", c:"orange", a:"4+"},
  {id:"math", t:"Qo'shamiz", c:"red", a:"5+"},
  {id:"pairs8", t:"Katta juftlik", c:"blue", a:"5+"},
  {id:"coloring", t:"Bo'yash", c:"green", a:"2+"}
];
const GICON = {colors:"M12 3a9 9 0 100 18c1.2 0 1.8-.8 1.8-1.6 0-1.2-1-1.4-1-2.4s.8-1.6 1.8-1.6H17a4 4 0 004-4c0-4.6-4-8.4-9-8.4z",
  shapes:"M4 14h7v7H4zM17.5 3l4.5 8h-9zM17.5 14a3.5 3.5 0 110 7 3.5 3.5 0 010-7z", pairs:"M3 4h8v10H3zM13 10h8v10h-8z",
  count:"M4 7h3v10M10 7h4l-4 10h4M17 7h3l-2 5a2.5 2.5 0 11-1 4.5", bigsmall:"M3 9h12v12H3zM17 3h4v4h-4z",
  oddone:"M5 5h4v4H5zM15 5h4v4h-4zM5 15h4v4H5zM17 15a2 2 0 110 4 2 2 0 010-4z", letters:"M4 20L10 4l6 16M6.5 14h7M17 9h4M19 7v4",
  simon:"M12 3v4M12 17v4M3 12h4M17 12h4M12 12h.01", math:"M12 5v14M5 12h14", pairs8:"M3 3h8v8H3zM13 3h8v8h-8zM3 13h8v8H3zM13 13h8v8h-8z",
  coloring:"M12 3a9 9 0 100 18c1.2 0 1.8-.8 1.8-1.6 0-1.2-1-1.4-1-2.4s.8-1.6 1.8-1.6H17a4 4 0 004-4c0-4.6-4-8.4-9-8.4z"};
function cardItem(it, K){
  return `<button class="card" onclick="openItem(${it.id})">
    <div class="thumb" style="background-color:${BG[K.c]};${it.thumb?`background-image:url('${esc(it.thumb)}')`:""}">
      <span class="play">${ico("M8 5v14l11-7z","#1F2A6B",20)}</span><span class="dur">${it.minutes} daq</span>
    </div>
    <span class="ttl">${esc(it.title)}</span>${it.series?`<span class="muted" style="font-size:12px;margin-top:-4px">${it.episode}-qism</span>`:""}
  </button>`;
}
function cardSeries(g, K, kind){
  const si = SER.push([kind, g.series]) - 1;
  return `<button class="card" onclick="openSeries(${si})">
    <div style="position:relative;padding-top:8px">
      <div style="position:absolute;left:10px;right:10px;top:0;height:20px;border-radius:14px 14px 0 0;background:${INK[K.c]};opacity:.35"></div>
      <div class="thumb" style="background-color:${BG[K.c]};${g.thumb?`background-image:url('${esc(g.thumb)}')`:""}">
        <span class="play" style="width:auto;padding:0 12px;border-radius:999px;gap:6px;font-weight:700;font-size:14px">${ico("M3 6a2 2 0 012-2h4l2 2h8a2 2 0 012 2v10a2 2 0 01-2 2H5a2 2 0 01-2-2z","#1F2A6B",18)} ${g.count} qism</span>
      </div>
    </div>
    <span class="ttl">${esc(g.series)}</span><span class="muted" style="font-size:12px;margin-top:-4px">Serial · ${Math.round(g.minutes)} daq</span>
  </button>`;
}
async function vList(kind){
  const K = KIND[kind];
  $app.innerHTML = head(K.t) + `<div class="pad" id="lst"><div class="empty">Yuklanmoqda...</div></div>`;
  let items = [];
  try { items = (await api("/api/content?kind="+kind)).items; } catch(e){ toast(e.message); }
  let html = "";
  if (kind === "game"){
    html += `<h2 style="font-size:20px;margin-bottom:12px">Kiddy o'yinlari</h2><div class="grid2" style="margin-bottom:24px">` +
      GAMES.map(g=>`<button class="tile t-${g.c}" style="height:108px" onclick="startGame('${g.id}')">${ico(GICON[g.id], INK[g.c], 30)}<span style="display:flex;justify-content:space-between;align-items:baseline;width:100%">${g.t}<small style="font-family:Nunito;font-size:12px;opacity:.8">${g.a}</small></span></button>`).join("") + `</div>`;
    if (items.length) html += `<h2 style="font-size:20px;margin-bottom:12px">Yana o'yinlar</h2>`;
  }
  if (!items.length && kind !== "game"){
    html += `<div class="empty">${ico(K.i,"#4A5580",56,1.6)}<p>${esc(ME.active.name)} yoshiga mos ${K.t.toLowerCase()} hali qo'shilmagan.<br>Tez orada!</p></div>`;
  } else {
    html += `<div class="grid2">` + items.map(g => g.t==="series" ? cardSeries(g, K, kind) : cardItem(g, K)).join("") + `</div>`;
  }
  document.getElementById("lst").innerHTML = html;
}
async function vSeries(kind, name){
  const K = KIND[kind] || KIND.cartoon;
  $app.innerHTML = head(esc(name)) + `<div class="pad" id="lst"><div class="empty">Yuklanmoqda...</div></div>`;
  let items = [];
  try { items = (await api("/api/series?name="+encodeURIComponent(name))).items; } catch(e){ toast(e.message); }
  document.getElementById("lst").innerHTML = items.length ? `<p class="muted" style="margin:0 0 14px">${items.length} ta qism</p><div class="grid2">` + items.map(it=>cardItem(it, K)).join("") + `</div>` : `<div class="empty">Qismlar topilmadi</div>`;
}

async function openItem(id){
  haptic();
  try {
    const r = await api("/api/open", {id});
    ME.active.stars = r.stars; ME.used += r.item.minutes;
    if (r.item.type === "link"){ tg ? tg.openLink(r.url) : window.open(r.url); toast(`+${r.stars_added} yulduz!`); return; }
    go("player", r);
  } catch(e){ showMsg(e.message); }
}

// ---------- pleyer ----------

function vColoring(idx){
  if (idx === undefined){
    $app.innerHTML = head("Bo'yash kitobi") + `<div class="pad"><p class="muted" style="margin-top:0">Rasm tanla</p><div class="grid2">${PICS.map((p,i)=>`
      <button class="card" onclick="go('coloring', ${i})"><div style="background:var(--green-l);border-radius:22px;padding:8px"><svg viewBox="0 0 320 340" style="width:100%;background:#fff;border-radius:16px;display:block" fill="#fff" stroke="#1F2A6B" stroke-width="6" stroke-linejoin="round" aria-hidden="true">${p.svg}</svg></div><span class="ttl">${p.t}</span></button>`).join("")}</div></div>`;
    return;
  }
  const P = PICS[idx];
  $app.innerHTML = head(P.t) + `<div class="pad" style="padding-top:0;display:flex;flex-direction:column;gap:14px">
    <div style="background:var(--green-l);border-radius:28px;padding:10px">
    <svg id="pic" viewBox="0 0 320 340" style="width:100%;background:#fff;border-radius:22px;display:block" fill="#FFFFFF" stroke="#1F2A6B" stroke-width="4" stroke-linejoin="round" role="img" aria-label="Bo'yash uchun rasm: ${esc(P.t)}">
      <rect x="0" y="0" width="320" height="340" fill="#FFFFFF" stroke="none" data-p="1"/>${P.svg}
    </svg></div>
    <div class="pal" style="flex-wrap:wrap;justify-content:center" role="radiogroup" aria-label="Rang">${PAL.map(c=>`<button role="radio" aria-label="Rang" style="background:${c};width:42px;height:42px" class="${c===paint?'on':''}" data-c="${c}"></button>`).join("")}</div>
    <div class="grid2"><button class="btn green" onclick="gameDone('coloring')">Tayyor</button><button class="btn" onclick="sendContest()">Tanlovga yuborish</button></div>
    <p class="muted" style="margin:0;text-align:center;font-size:14px">Tanlov: "${esc(ME.contest_title)}"</p>
  </div>`;
  $app.querySelectorAll("#pic [data-p]").forEach(el=>el.addEventListener("click",()=>{ el.setAttribute("fill", paint); haptic(); }));
  $app.querySelectorAll(".pal button").forEach(b=>b.onclick=()=>{ paint=b.dataset.c; $app.querySelectorAll(".pal button").forEach(x=>x.classList.toggle("on",x===b)); });
}
async function sendContest(){
  const svg = new XMLSerializer().serializeToString(document.getElementById("pic"));
  const img = new Image(); img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
  await new Promise(r=>{ img.onload=r; img.onerror=r; });
  const cv = document.createElement("canvas"); cv.width=640; cv.height=680; const cx = cv.getContext("2d");
  cx.fillStyle="#fff"; cx.fillRect(0,0,640,680); cx.drawImage(img,0,0,640,680);
  try{ await api("/api/contest",{png: cv.toDataURL("image/png")}); haptic("heavy"); showMsg("Rasming tanlovga yuborildi! Natijani bot orqali e'lon qilamiz.","Rahmat!"); }catch(e){ toast(e.message); }
}

// ---------- ota-ona ----------
async function vParent(){
  if (!PKEY) return pinPad();
  let d; try{ d = await api("/api/parent"); }catch(e){ PKEY=""; return pinPad(); }
  const sw = (on, act) => `<button class="sw ${on?'on':''}" role="switch" aria-checked="${on}" onclick="${act}"><b></b></button>`;
  $app.innerHTML = head("Ota-ona paneli") + `<div class="pad" style="padding-top:0;display:flex;flex-direction:column;gap:16px;background:var(--soft);min-height:100vh">
    <div class="box">
      <div class="row"><div style="flex:1"><div style="font-weight:700">Kunlik vaqt</div><div class="muted" style="font-size:13px">Har bir bola uchun</div></div>
        <button class="key" style="width:46px;height:46px;font-size:24px;background:var(--soft)" onclick="psave({limit:${d.limit-15}})" aria-label="Kamaytirish">−</button><b style="min-width:62px;text-align:center">${d.limit} daq</b><button class="key" style="width:46px;height:46px;font-size:24px;background:var(--soft)" onclick="psave({limit:${d.limit+15}})" aria-label="Ko'paytirish">+</button></div>
      <div class="row"><div style="flex:1"><div style="font-weight:700">Uxlash vaqti</div><div class="muted" style="font-size:13px">Bu vaqtda Kiddy TV yopiq</div></div>${sw(d.sleep.on,`psave({sleep_on:${!d.sleep.on}})`)}</div>
      ${d.sleep.on?`<div class="row" style="gap:8px"><input type="time" value="${d.sleep.from}" onchange="psave({sleep_from:this.value})" aria-label="Boshlanishi"><span>—</span><input type="time" value="${d.sleep.to}" onchange="psave({sleep_to:this.value})" aria-label="Tugashi"></div>`:""}
      <div class="row"><div style="flex:1"><div style="font-weight:700">Haftalik hisobot</div><div class="muted" style="font-size:13px">Har yakshanba botga</div></div>${sw(d.report,`psave({report:${!d.report}})`)}</div>
    </div>
    <h2 style="margin-top:4px">Bolalar</h2>
    ${d.kids.map(k=>`<div class="box" style="padding:14px 16px"><div style="display:flex;align-items:center;gap:10px"><b style="flex:1;font-size:17px">${esc(k.name)} <span class="muted" style="font-weight:600;font-size:14px">· ${k.age} yosh</span></b><button class="muted" style="font-size:13px" onclick="delKid(${k.id},'${esc(k.name)}')">O'chirish</button></div>
      <div class="grid3" style="margin-top:10px">
        <div style="background:var(--red-l);border-radius:16px;padding:10px"><div class="big" style="font-size:20px;color:var(--red-d)">${k.today}</div><div style="font-size:12px">bugun, daq</div></div>
        <div style="background:var(--blue-l);border-radius:16px;padding:10px"><div class="big" style="font-size:20px;color:var(--blue-d)">${k.week.minutes}</div><div style="font-size:12px">hafta, daq</div></div>
        <div style="background:var(--orange-l);border-radius:16px;padding:10px"><div class="big" style="font-size:20px;color:var(--orange-d)">${k.stars}</div><div style="font-size:12px">yulduz</div></div>
      </div>${k.week.top?`<div class="muted" style="font-size:13px;margin-top:8px">Eng ko'p ko'rgani: ${esc(k.week.top)}</div>`:""}</div>`).join("")}
    <button class="btn ghost" style="background:#fff" onclick="go('addchild')">+ Bola qo'shish</button>
    ${d.blocked.length?`<h2>Yopilgan kontent</h2><div class="box">${d.blocked.map(b=>`<div class="row"><span style="flex:1">${esc(b.title)}</span><button class="btn ghost" style="width:auto;min-height:38px;font-size:14px" onclick="psave({unblock:${b.id}})">Ochish</button></div>`).join("")}</div>`:""}
    <button class="btn ghost" style="background:#fff" onclick="changePin()">PIN-kodni almashtirish</button>
    <button class="btn ghost" style="background:#fff" onclick="PKEY='';back()">Chiqish</button>
  </div>`;
}
async function psave(data){ try{ await api("/api/parent", data); await refresh(); vParent(); }catch(e){ toast(e.message); if(e.code===403){PKEY="";} } }
async function delKid(id, name){
  if (tg && tg.showConfirm){ const ok = await new Promise(r=>tg.showConfirm(`${name} o'chirilsinmi? Yulduzlari ham o'chadi.`, r)); if(!ok) return; }
  await psave({delete_child:id}); if(!ME.active){ VIEW=[["addchild",true]]; render(); }
}
function pinPad(mode){
  let pin = "";
  const title = mode==="new" ? "Yangi PIN-kod" : (ME.has_pin ? "PIN-kodni kiriting" : "PIN-kod o'ylab toping");
  const draw = () => {
    $app.innerHTML = head("Ota-ona bo'limi") + `<div class="pad" style="display:flex;flex-direction:column;gap:22px;align-items:center;text-align:center">
      <span class="round" style="width:80px;height:80px;border-radius:26px;background:var(--blue-l);box-shadow:none">${ico("M5 11h14v10H5zM8 11V7a4 4 0 018 0v4","#2446A0",38)}</span>
      <h2>${title}</h2>${!ME.has_pin&&mode!=="new"?`<p class="muted" style="margin:-12px 0 0;font-size:14px">4 ta raqam. Bola bilmasin!</p>`:""}
      <div class="dots">${[0,1,2,3].map(i=>`<i class="${i<pin.length?'on':''}"></i>`).join("")}</div>
      <div class="keys" style="width:100%">${["1","2","3","4","5","6","7","8","9","","0","⌫"].map(k=>k?`<button class="key" data-k="${k}" aria-label="${k==='⌫'?"O'chirish":k}">${k}</button>`:"<span></span>").join("")}</div></div>`;
    $app.querySelectorAll("[data-k]").forEach(b=>b.onclick=async()=>{
      haptic(); const k=b.dataset.k; if(k==="⌫"){ pin=pin.slice(0,-1); return draw(); }
      if(pin.length<4) pin+=k; draw();
      if(pin.length===4){
        try{
          if(mode==="new"){ await api("/api/parent",{pin}); toast("PIN-kod almashtirildi"); vParent(); return; }
          const r = await api("/api/parent/unlock",{pin}); PKEY=r.key; ME.has_pin=true; vParent();
        }catch(e){ toast(e.message); pin=""; setTimeout(draw,300); }
      }
    });
  };
  draw();
}
function changePin(){ pinPad("new"); }

function showMsg(text, title){
  const m = document.createElement("div"); m.className="modal";
  m.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><h2>${esc(title||"Kiddy TV")}</h2><p style="margin:0;white-space:pre-line;font-size:17px">${esc(text)}</p><button class="btn">Yaxshi</button></div>`;
  m.querySelector("button").onclick = ()=>m.remove(); m.onclick = e=>{ if(e.target===m) m.remove(); };
  document.body.appendChild(m);
}

(async function init(){
  if (tg){ tg.ready(); tg.expand(); try{ tg.setHeaderColor("#FFF4E6"); tg.setBackgroundColor("#FFFFFF"); }catch(e){} tg.BackButton.onClick(back); }
  if (!INIT){ $app.innerHTML = `<div class="empty"><img src="/logo.png" width="120" height="120" alt="Kiddy Toys" style="border-radius:50%"><h1 style="margin-top:12px">Kiddy TV</h1><p>Bu ilova Telegram ichida ochiladi.<br>Botdagi «Kiddy TV ni ochish» tugmasini bosing.</p></div>`; return; }
  try{ await refresh(); render(); }catch(e){ $app.innerHTML = `<div class="empty">Ulanib bo'lmadi: ${esc(e.message)}<br><br><button class="btn" onclick="location.reload()">Qayta urinish</button></div>`; }
})();
</script>
